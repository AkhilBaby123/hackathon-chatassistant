        type: string

      - name: is_vat_included_in_net
        sql: is_vat_included_in_net
        type: string

      - name: item_code
        sql: item_code
        type: string

      - name: item_type
        sql: item_type
        type: string

      - name: location_rk
        sql: location_rk
        type: string

      - name: online_sales_order_code
        sql: online_sales_order_code
