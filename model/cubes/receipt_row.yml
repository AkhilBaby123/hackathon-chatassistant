      - name: org_location_rk
        sql: org_location_rk
        type: string

      - name: org_receipt_no
        sql: org_receipt_no
        type: string

      - name: org_till_no
        sql: org_till_no
        type: string

      - name: oris3_info
        sql: oris3_info
        type: string

      - name: pos_identity
        sql: pos_identity
        type: string

      - name: product_price_type_rk
        sql: product_price_type_rk
        type: string

      - name: product_rk
        sql: product_rk
        type: string

      - name: product_rk_clr
        sql: product_rk_clr
