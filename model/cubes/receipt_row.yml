      - name: retail_price_modifier
        sql: retail_price_modifier
        type: string

      - name: sales_transaction_type
        sql: sales_transaction_type
        type: string

      - name: seasonless_article_rk
        sql: seasonless_article_rk
        type: string

      - name: seasonless_product_rk
        sql: seasonless_product_rk
        type: string

   
      - name: store_till_rk
        sql: store_till_rk
        type: string

      - name: till_no
        sql: till_no
        type: string

      - name: till_type
        sql: till_type
        type: string

      - name: transaction_status
