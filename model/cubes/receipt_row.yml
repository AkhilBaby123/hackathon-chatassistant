cubes:
  - name: receipt_row
    sql_table: sales_serving.receipt_row
    data_source: default

    joins: 
      - name: receipt 
        sql: "{CUBE}.receipt_rk = {receipt}.receipt_rk"
        relationship: many_to_one
      - name: product
        sql: "{CUBE}.product_rk = {product}.product_rk"
        relationship: many_to_one
      - name: article
        sql: "{CUBE}.article_rk = {article}.article_rk"
        relationship: many_to_one

    dimensions:
      - name: article_rk
        sql: article_rk
        type: string

      - name: article_rk_clr
        sql: article_rk_clr
        type: string

      - name: claim_code_desc
        sql: claim_code_desc
        type: string

      - name: claim_code_rk
        sql: claim_code_rk
        type: string

      - name: corporate_brand_rk
        sql: corporate_brand_rk
        type: string

      - name: country_rk
        sql: country_rk
        type: string

      - name: currency_rk
        sql: currency_rk
        type: string

      - name: customer_return_flag
        sql: customer_return_flag
        type: string

      - name: department_corporate_brand_rk
        sql: department_corporate_brand_rk
        type: string


      - name: entry_method
        sql: entry_method
        type: string

      - name: exempt_tax_amount
        sql: exempt_tax_amount
        type: string

      - name: is_cross_brand
        sql: is_cross_brand
        type: string

      - name: is_online_return_flag
